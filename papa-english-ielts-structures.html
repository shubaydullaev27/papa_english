.hdr h1{font:700 19px/1.1 'Playfair Display',Georgia,serif;margin:0}.hdr small{display:block;font:500 12px Inter,Arial,sans-serif;color:var(--cl);margin-top:3px}
.sp{flex:1}.handle{border:1.5px solid var(--champ);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;background:rgba(169,130,97,.2);white-space:nowrap;color:var(--iv)}
.tg{background:none;border:1.5px solid var(--champ);color:var(--iv);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:15px}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:26px 20px 60px}
nav{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px}
nav h2{font:700 16px 'Playfair Display',Georgia,serif;margin:2px 6px 10px;color:var(--head)}
.tot{height:6px;border-radius:9px;background:var(--soft);margin:0 6px 12px;overflow:hidden}.tot i{display:block;height:100%;background:var(--champ);width:0;transition:width .4s}
.ni{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 8px;cursor:pointer;color:var(--ink);font:500 14px/1.3 Inter,Arial,sans-serif}
.ni:hover{background:var(--soft)}.ni[aria-current=true]{background:var(--burg);color:#fff;box-shadow:inset 3px 0 0 var(--champ)}
.ni b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--soft);color:var(--head)}
.ni[aria-current=true] b{background:var(--cl);color:var(--burg)}.ni.done b{background:var(--ok);color:#fff}.ni em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mut)}.ni[aria-current=true] em{color:var(--cl)}
.ni.lock{opacity:.6;cursor:default}
.ttl{background:linear-gradient(135deg,var(--burg),#64203a);color:var(--iv);border-radius:16px;padding:26px 28px;border-bottom:4px solid var(--champ)}
.ttl h2{font:700 clamp(22px,3.4vw,32px)/1.2 'Playfair Display',Georgia,serif;margin:10px 0 8px;color:#fff}.ttl p{margin:0;color:var(--cl)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;background:var(--cl);color:var(--burg)}
.sec{margin-top:28px}.sec>h3{font:700 22px 'Playfair Display',Georgia,serif;color:var(--head);margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}.card h4{margin:0 0 8px;font-size:15px;font-weight:700}
.meaning{border-left:6px solid var(--ta)}.how{border-left:6px solid var(--vc)}.tip{border-left:6px solid var(--champ);background:var(--soft)}.tr{border-left:6px solid var(--rb)}
.formula{background:var(--fm);color:var(--iv);border-radius:14px;padding:20px 22px;margin-bottom:14px;border:1px solid rgba(233,220,203,.18)}
.formula h4{margin:0 0 6px;color:var(--cl);font-size:14px}.formula .f{font:600 clamp(16px,2.4vw,20px)/2.1 'Playfair Display',Georgia,serif}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:13px}
.h{border-radius:6px;padding:1px 7px;font-weight:600}.h.k{background:var(--kb);color:var(--kt)}.h.a{background:var(--ta-bg);color:var(--ta)}.h.b{background:var(--rb-bg);color:var(--rb)}.h.c{background:var(--vc-bg);color:var(--vc)}
.formula .h.k{background:#E9D3AA;color:#3b2410}.formula .h.a{background:#12877e;color:#fff}.formula .h.b{background:#c22e5b;color:#fff}.formula .h.c{background:#6256d1;color:#fff}
ul.ex{list-style:none;margin:0;padding:0}ul.ex li{padding:10px 0 10px 28px;position:relative;border-top:1px dashed var(--line)}ul.ex li:first-child{border:0}
ul.ex li::before{content:"”";position:absolute;left:2px;top:4px;font:700 30px 'Playfair Display',Georgia,serif;color:var(--champ)}
.ielts{border-top:4px solid var(--rb)}.eg{border-top:4px solid var(--ta)}.how ol{margin:0;padding-left:20px}.how li{margin:4px 0}
.tabs{display:inline-flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px;margin-left:8px;vertical-align:middle}
.tabs button{border:0;background:none;color:var(--ink);font:600 12px Inter,Arial,sans-serif;padding:4px 12px;border-radius:999px;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--burg);color:#fff}

const D=[{"t":"“Given the choice between A and B, I would + verb…”","tag":"Speaking","def":"Say which of two options you would choose, and why.","f":"{k|Given the choice between} {a|A} {k|and} {b|B}, {k|I would} {c|+ verb} … {k|because} {c|reason}","lg":["k","a","b","c"],"how":["Name two real options after “between”.","Say your choice with “I would…”.","Finish with because / since / as and a reason."],"eg":["{k|Given the choice between} {a|living in a city} and {b|the countryside}, I {k|would} choose the city {c|because I enjoy a fast-paced lifestyle}.","{k|Given the choice between} {a|working from home} and {b|working in an office}, I {k|would} work from home {c|for better flexibility}."],"ie":["{k|Given the choice between} {a|working for a large company} and {b|starting my own business}, I {k|would} start my own business, {c|because independence is more important to me than stability}.","{k|Given the choice between} {a|spending money on luxury items} and {b|investing in education}, I {k|would} invest in education, {c|since knowledge provides long-term benefits}."],"tip":"Always use “would”, not “will”. The situation is imaginary.","tr":{"uz":["Ikki variant orasidan xayoliy tanlov qilib, o‘z afzalligingizni bildirish uchun ishlatiladi.","Shahar va qishloq o‘rtasida tanlash imkoni berilsa, men shaharni tanlagan bo‘lardim, chunki tez sur’atli hayotni yoqtiraman."],"ru":["Выражает предпочтение в воображаемой ситуации выбора между двумя вариантами.","Если бы пришлось выбирать между городом и деревней, я бы выбрал город, потому что мне нравится быстрый ритм жизни."]},"t1":[{"c":["Given the choice between","tea and coffee,","I would","choose coffee","because it wakes me up."],"uz":"Choy va qahva orasida tanlasam, qahvani tanlardim, chunki u meni uyg‘otadi.","ru":"Если бы пришлось выбирать между чаем и кофе, я бы выбрал кофе, потому что он бодрит."},{"c":["Given the choice between","a big salary","and more free time,","I would","pick free time,","since I value balance."],"uz":"Katta maosh va ko‘proq bo‘sh vaqt orasida tanlasam, bo‘sh vaqtni tanlardim, chunki muvozanatni qadrlayman.","ru":"Между большой зарплатой и свободным временем я бы выбрал свободное время, так как ценю баланс."},{"c":["Given the choice between","trains and planes,","I would","take the train","as it is more relaxing."],"uz":"Poyezd va samolyot orasida tanlasam, poyezdda ketardim, chunki u ko‘proq dam beradi.","ru":"Между поездом и самолётом я бы выбрал поезд, так как он более расслабляющий."}],"ck":[["Starts with “Given the choice between … and …”",/^\s*given the choice between .+ and /i],["Uses “I would”",/\bi would\b/i],["Gives a reason (because / since / as)",/\b(because|since|as)\b/i]],"w":[{"p":"Tea or coffee: which would you choose, and why?","m":"{k|Given the choice between} tea and coffee, {k|I would} choose coffee {c|because it helps me concentrate in the morning}."},{"p":"Big city or quiet village: where would you live, and why?","m":"{k|Given the choice between} a big city and a quiet village, {k|I would} live in a village {c|since I enjoy peaceful surroundings}."},{"p":"IELTS Part 1: Do you prefer studying alone or with others?","m":"{k|Given the choice between} studying alone and studying with others, {k|I would} study alone {c|as I concentrate better in silence}."}],"lt":{"k":"Fixed words","a":"Option 1","b":"Option 2","c":"Your choice and reason"},"st":{"uz":"A va B orasida tanlash imkoni berilsa, men … tanlagan bo‘lardim","ru":"Если бы пришлось выбирать между A и B, я бы выбрал(а)…"},"p":{"ipa":"/ˌɡɪvn ðə ˈtʃɔɪs bɪˈtwiːn/ … /aɪ wʊd/","say":"<b>GIV</b>-n thuh <b>CHOYSS</b> bih-<b>TWEEN</b> … I <b>WOOD</b>","ph":"Given the choice between … I would"}},{"t":"“Let alone” — much less / not to mention","tag":"Speaking + Writing","def":"After a negative idea, add something even harder: “can’t do X, let alone Y”.","f":"{a|Negative sentence}, {k|let alone} {b|even harder thing}","lg":["a","k","b"],"how":["Start with a negative sentence about something difficult.","Add “let alone” and something even bigger.","Never use it after a positive verb."],"eg":["{a|I can’t afford a car}, {k|let alone} {b|a house}.","{a|He doesn’t have time to relax}, {k|let alone} {b|travel}.","{a|I don’t understand basic math}, {k|let alone} {b|advanced physics}."],"ie":["{a|Some countries struggle to provide basic education}, {k|let alone} {b|advanced research facilities}.","{a|Many students find it difficult to pass exams}, {k|let alone} {b|achieve outstanding results}."],"tip":"The second idea must be stronger than the first: car → house, relax → travel.","tr":{"uz":["Birinchisidan ham qiyinroq yoki ehtimoli kamroq narsani qo‘shadi: «…, … u yoqda tursin».","Men mashina sotib ololmayman, uy u yoqda tursin."],"ru":["Добавляет нечто ещё более трудное или маловероятное: «…, не говоря уже о …».","Я не могу позволить себе машину, не говоря уже о доме."]},"t1":[{"c":["I can’t even cook an egg,","let alone","a three-course dinner."],"uz":"Men tuxum ham pishira olmayman, uch xil taomli kechki ovqat u yoqda tursin.","ru":"Я не умею даже яйцо сварить, не говоря уже об ужине из трёх блюд."},{"c":["Many villages don’t have clean water,","let alone","high-speed internet."],"uz":"Ko‘p qishloqlarda toza suv yo‘q, tezkor internet u yoqda tursin.","ru":"Во многих деревнях нет чистой воды, не говоря уже о скоростном интернете."},{"c":["She hasn’t finished the first page,","let alone","the whole essay."],"uz":"U birinchi betni ham tugatmadi, butun insho u yoqda tursin.","ru":"Она не закончила даже первую страницу, не говоря уже обо всём эссе."}],"ck":[["Uses “let alone”",/let alone/i],["Starts with a negative idea (can’t, don’t, not, no…)",/(n['’]t|\bnot\b|\bno\b|\bnever\b|\bcannot\b|hardly|barely).*let alone/i],["Adds something after “let alone”",/let alone\s+\w+/i]],"w":[{"p":"Write about a skill you don’t have and a harder one that follows from it.","m":"I {a|can’t even swim a full length of the pool}, {k|let alone} {b|compete in a triathlon}."},{"p":"Educ good or bad?","m":"{a|Whether technology helps us} {k|comes down to} {b|how we use it}."}]},{"t":"“Subject + is no exception”","tag":"Speaking + Writing","mw":8,"def":"A trend affects many things, and you add one more that is affected too.","f":"{a|General trend}, {k|and} {b|subject} {k|is no exception}","lg":["a","k","b"],"lt":{"a":"A trend that affects many things","k":"Fixed words","b":"The thing you add"},"st":{"uz":"…, va … ham bundan mustasno emas","ru":"…, и … не исключение"},"p":{"ipa":"/ɪz nəʊ ɪkˈsepʃn/","say":"iz <b>NOH</b> ik-<b>SEP</b>-shn","ph":"is no exception"},"eg":["{a|Technology is improving rapidly}, {k|and} {b|education} {k|is no exception}.","{a|Stress is common in modern life}, {k|and} {b|students} {k|are no exception}."],"ie":["{a|Many industries are affected by globalisation}, {k|and} {b|agriculture} {k|is no exception}.","{a|Many professions are becoming more competitive}, {k|and} {b|the field of education} {k|is no exception}."],"tip":"Put a comma before “and”, and make the verb agree: students are no exception.","tr":{"uz":["Keng tarqalgan tendensiya yana bir narsaga ham tegishli ekanini ko‘rsatadi.","Texnologiya tez rivojlanmoqda, ta’lim ham bundan mustasno emas."],"ru":["Показывает, что общая тенденция касается и ещё одного явления.","Технологии быстро развиваются, и образование не исключение."]},"t1":[{"c":["Technology is improving rapidly,","and education","is no exception."],"uz":"Texnologiya tez rivojlanmoqda, ta’lim ham bundan mustasno emas.","ru":"Технологии быстро развиваются, и образование — не исключение."},{"c":["Stress is common in modern life,","and students","are no exception."],"uz":"Zamonaviy hayotda stress keng tarqalgan, o‘quvchilar ham bundan mustasno emas.","ru":"Стресс распространён в современной жизни, и студенты — не исключение."},{"c":["Many industries are affected by globalisation,","and agriculture","is no exception."],"uz":"Ko‘p tarmoqlarga globallashuv ta’sir qilgan, qishloq xo‘jaligi ham bundan mustasno emas.","ru":"Многие отрасли затронуты глобализацией, и сельское хозяйство — не исключение."}],"ck":[["Uses “is / are no exception”",/\b(is|are|was|were) no exception/i],["Pattern: trend, and X is no exception",/,\s*and\s+.+no exception/i]],"w":[{"p":"Prices are rising everywhere. Add one specific example.","m":"{a|Prices are rising in many countries}, {k|and} {b|housing} {k|is no exception}."},{"p":"Pollution affects many areas of life. Add one more.","m":"{a|Pollution is harming nature}, {k|and} {b|cities} {k|are no exception}."},{"p":"Competition is growing in many jobs. Add one profession.","m":"{a|Competition is growing in many careers}, {k|and} {b|medicine} {k|is no exception}."}]},{"t":"“Subject + plays a crucial role in + noun / V-ing”","tag":"Speaking + Writing","mw":8,"def":"Something is very important in causing or influencing something else.","f":"{a|Subject} {k|plays a crucial role in} {b|noun / V-ing}","lg":["a","k","b"],"lt":{"a":"Subject","k":"Fixed words","b":"What it influences"},"st":{"uz":"…da hal qiluvchi rol o‘ynaydi","ru":"играет решающую роль в …"},"p":{"ipa":"/pleɪz ə ˈkruːʃl rəʊl ɪn/","say":"playz uh <b>KROO</b>-shl <b>ROHL</b> in","ph":"plays a crucial role in"},"eg":["{a|Education} {k|plays a crucial role in} {b|personal development}.","{a|Technology} {k|plays a crucial role in} {b|modern communication}."],"ie":["{a|Public awareness} {k|plays a crucial role in} {b|solving environmental problems}.","{a|Government policy} {k|plays a crucial role in} {b|economic stability}."],"tip":"After “in”, use a noun or V-ing: a crucial role in solving problems.","tr":{"uz":["Biror narsa boshqasiga katta ta’sir qilishini bildiradi; akademik nutqda tez-tez ishlatiladi.","Ta’lim shaxsiy rivojlanishda hal qiluvchi rol o‘ynaydi."],"ru":["Показывает, что что-то очень важно для другого; частая академическая фраза.","Образование играет решающую роль в личностном развитии."]},"t1":[{"c":["Education","plays a crucial role in","personal development."],"uz":"Ta’lim shaxsiy rivojlanishda hal qiluvchi rol o‘ynaydi.","ru":"Образование играет решающую роль в личностном развитии."},{"c":["Technology","plays a crucial role in","modern communication."],"uz":"Texnologiya zamonaviy aloqada hal qiluvchi rol o‘ynaydi.","ru":"Технологии играют решающую роль в современной коммуникации."},{"c":["Government policy","plays a crucial role in","economic stability."],"uz":"Hukumat siyosati iqtisodiy barqarorlikda hal qiluvchi rol o‘ynaydi.","ru":"Государственная политика играет решающую роль в экономической стабильности."}],"ck":[["Uses “plays a crucial role in”",/\bplay(s|ed)? a crucial role in\b/i],["Something follows “role in”",/role in\s+\w+/i],["Starts with a subject",/\w+\s+play(s|ed)? a crucial/i]],"w":[{"p":"What helps students reach their goals?","m":"{a|Motivation} {k|plays a crucial role in} {b|helping students reach their goals}."},{"p":"Why is sleep important?","m":"{a|Sleep} {k|plays a crucial role in} {b|keeping our minds and bodies healthy}."},{"p":"What does the media do for society?","m":"{a|The media} {k|plays a crucial role in} {b|shaping public opinion}."}]}]);
D.push(...[{"t":"“Subject + serves as + noun”","tag":"Speaking + Writing","mw":8,"def":"Says what something functions as. It is more elegant than “is”.","f":"{a|Subject} {k|serves as} {b|noun}","lg":["a","k","b"],"lt":{"a":"Subject","k":"Fixed words","b":"What it functions as"},"st":{"uz":"…vazifasini bajaradi, … bo‘lib xizmat qiladi","ru":"служит …, выступает в роли …"},"p":{"ipa":"/sɜːvz əz/","say":"<b>SERVZ</b> uz","ph":"serves as"},"eg":["{a|This book} {k|serves as} {b|a useful guide for beginners}.","{a|The park} {k|serves as} {b|a meeting point for the community}."],"ie":["{a|Education} {k|serves as} {b|a foundation for long-term social and economic development}.","{a|Public transport} {k|serves as} {b|an affordable solution for reducing traffic congestion}."],"tip":"After “serves as”, use a noun (a guide, a tool), not a verb.","tr":{"uz":["Biror narsa qanday vazifa bajarishini bildiradi; “is”dan ko‘ra akademikroq.","Bu kitob boshlovchilar uchun foydali qo‘llanma bo‘lib xizmat qiladi."],"ru":["Показывает, какую функцию выполняет предмет; звучит академичнее, чем «is».","Эта книга служит полезным руководством для начинающих."]},"t1":[{"c":["This book","serves as","a useful guide for beginners."],"uz":"Bu kitob boshlovchilar uchun foydali qo‘llanma bo‘lib xizmat qiladi.","ru":"Эта книга служит полезным руководством для начинающих."},{"c":["The park","serves as","a meeting point for the community."],"uz":"Bog‘ jamoa uchun uchrashuv joyi bo‘lib xizmat qiladi.","ru":"Парк служит местом встреч для местного сообщества."},{"c":["Education","serves as","a foundation for long-term development."],"uz":"Ta’lim uzoq muddatli rivojlanish uchun poydevor bo‘lib xizmat qiladi.","ru":"Образование служит основой для долгосрочного развития."}],"ck":[["Uses “serves as”",/\bserv(es|ed)? as\b/i],["A noun follows “serves as”",/serv(es|ed)? as\s+\w+/i]],"w":[{"p":"Describe a place where people in your area meet.","m":"{a|The central square} {k|serves as} {b|a meeting point for local families}."},{"p":"What is the role of the internet today?","m":"{a|The internet} {k|serves as} {b|a powerful source of information}."},{"p":"What does a library give to a community?","m":"{a|A public library} {k|serves as} {b|a quiet space for study and learning}."}]},{"t":"“Subject + goes a long way in + V-ing / noun”","tag":"Speaking + Writing","mw":8,"def":"Something contributes a great deal to a result, even if it is not the whole solution.","f":"{a|Subject} {k|goes a long way in} {b|V-ing / noun}","lg":["a","k","b"],"lt":{"a":"Subject","k":"Fixed words","b":"The result it helps achieve"},"st":{"uz":"…ga katta hissa qo‘shadi","ru":"очень помогает в …"},"p":{"ipa":"/gəʊz ə lɒŋ weɪ ɪn/","say":"gohz uh <b>LONG</b> <b>WAY</b> in","ph":"goes a long way in"},"eg":["{a|Kindness} {k|goes a long way in} {b|building trust}.","{a|A good night’s sleep} {k|goes a long way in} {b|improving productivity}."],"ie":["{a|Regular exercise} {k|goes a long way in} {b|maintaining both physical and mental health}.","{a|Government investment in education} {k|goes a long way in} {b|improving a country’s economic prospects}."],"tip":"Match the verb: kindness goes… / small changes can go a long way in…","tr":{"uz":["Biror narsa natijaga erishishga katta hissa qo‘shishini bildiradi.","Mehribonlik ishonch qurishda katta yordam beradi."],"ru":["Показывает, что что-то сильно помогает достичь результата.","Доброта очень помогает строить доверие."]},"t1":[{"c":["Kindness","goes a long way in","building trust."],"uz":"Mehribonlik ishonch qurishda katta yordam beradi.","ru":"Доброта очень помогает строить доверие."},{"c":["A good night’s sleep","goes a long way in","improving productivity."],"uz":"Yaxshi uyqu samaradorlikni oshirishda katta yordam beradi.","ru":"Хороший сон сильно помогает повысить продуктивность."},{"c":["Regular exercise","goes a long way in","maintaining physical and mental health."],"uz":"Muntazam mashq jismoniy va ruhiy salomatlikni saqlashda katta yordam beradi.","ru":"Регулярные упражнения очень помогают поддерживать физическое и психическое здоровье."}],"ck":[["Uses “goes / go a long way in”",/\b(goes|go|went) a long way in\b/i],["Something follows “long way in”",/long way in\s+\w+/i]],"w":[{"p":"How can small actions help other people?","m":"{a|A simple smile} {k|goes a long way in} {b|making people feel welcome}."},{"p":"How can students improve their grades?","m":"{a|Regular revision} {k|goes a long way in} {b|improving exam results}."},{"p":"How can people protect the environment?","m":"{a|Small lifestyle changes} {k|can go a long way in} {b|reducing waste}."}]},{"t":"“Subject + is widely regarded as + noun / adjective”","tag":"Speaking + Writing","mw":8,"def":"Many people generally see something this way. Your claim has broad support.","f":"{a|Subject} {k|is widely regarded as} {b|noun / adjective}","lg":["a","k","b"],"lt":{"a":"Subject","k":"Fixed words","b":"How most people see it"},"st":{"uz":"…deb keng e’tirof etiladi","ru":"широко считается …"},"p":{"ipa":"/ɪz ˈwaɪdli rɪˈɡɑːdɪd æz/","say":"iz <b>WIDE</b>-lee rih-<b>GAR</b>-did az","ph":"is widely regarded as"},"eg":["{a|He} {k|is widely regarded as} {b|one of the best teachers in the school}.","{a|The book} {k|is widely regarded as} {b|a masterpiece}."],"ie":["{a|Education} {k|is widely regarded as} {b|the key to social mobility}.","{a|Public transport} {k|is widely regarded as} {b|an effective solution to urban traffic problems}."],"tip":"It is a passive form: is / are regarded as. Never write “is widely regard as”.","tr":{"uz":["Ko‘pchilik biror narsani shunday deb hisoblashini bildiradi; da’voingiz keng qo‘llab-quvvatlanishini ko‘rsatadi.","U maktabdagi eng yaxshi o‘qituvchilardan biri deb keng e’tirof etiladi."],"ru":["Показывает, что многие так считают; ваше утверждение имеет широкую поддержку.","Его широко считают одним из лучших учителей школы."]},"t1":[{"c":["The book","is widely regarded as","a masterpiece."],"uz":"Kitob durdona asar deb keng e’tirof etiladi.","ru":"Книгу широко считают шедевром."},{"c":["Education","is widely regarded as","the key to social mobility."],"uz":"Ta’lim ijtimoiy yuksalishning kaliti deb keng e’tirof etiladi.","ru":"Образование широко считается ключом к социальной мобильности."},{"c":["Public transport","is widely regarded as","an effective solution to traffic problems."],"uz":"Jamoat transporti tirbandlikka samarali yechim deb keng e’tirof etiladi.","ru":"Общественный транспорт широко считается эффективным решением проблем с пробками."}],"ck":[["Uses “is / are widely regarded as”",/\b(is|are|was|were) widely regarded as\b/i],["Something follows “regarded as”",/regarded as\s+\w+/i]],"w":[{"p":"What do most people think about reading?","m":"{a|Reading} {k|is widely regarded as} {b|one of the best ways to learn}."},{"p":"Describe a respected person you know.","m":"{a|My grandfather} {k|is widely regarded as} {b|a wise man in our village}."},{"p":"What do people think about solar energy?","m":"{a|Solar energy} {k|is widely regarded as} {b|a clean and sustainable option}."}]},{"t":"“Subject + is often attributed to + noun / V-ing”","tag":"Writing","mw":8,"def":"Something is believed to be caused by something else. It is more academic than “caused by”.","f":"{a|Subject} {k|is often attributed to} {b|noun / V-ing}","lg":["a","k","b"],"lt":{"a":"Subject (the effect)","k":"Fixed words","b":"The believed cause"},"st":{"uz":"…ga bog‘lanadi, …ning oqibati deb hisoblanadi","ru":"часто объясняют …, приписывают …"},"p":{"ipa":"/ɪz ˈɒfn əˈtrɪbjuːtɪd tuː/","say":"iz <b>OF</b>-n uh-<b>TRIB</b>-yoo-tid too","ph":"is often attributed to"},"eg":["{a|His success} {k|is often attributed to} {b|his strong work ethic}.","{a|The team’s failure} {k|is often attributed to} {b|poor communication}."],"ie":["{a|Traffic congestion in major cities} {k|is often attributed to} {b|poor urban planning}.","{a|The rise in obesity rates} {k|is often attributed to} {b|sedentary lifestyles}."],"tip":"The effect comes first, the cause after “to”: A is attributed to B.","tr":{"uz":["Biror narsa boshqa narsadan kelib chiqqan deb hisoblanishini bildiradi; “caused by”dan akademikroq.","Uning muvaffaqiyati ko‘pincha kuchli mehnatsevarligiga bog‘lanadi."],"ru":["Показывает, что причиной считают нечто другое; академичнее, чем «caused by».","Его успех часто объясняют сильной трудовой этикой."]},"t1":[{"c":["His success","is often attributed to","his strong work ethic."],"uz":"Uning muvaffaqiyati ko‘pincha kuchli mehnatsevarligiga bog‘lanadi.","ru":"Его успех часто объясняют сильной трудовой этикой."},{"c":["The team’s failure","is often attributed to","poor communication."],"uz":"Jamoaning mag‘lubiyati ko‘pincha yomon muloqotga bog‘lanadi.","ru":"Неудачу команды часто объясняют плохой коммуникацией."},{"c":["Traffic congestion in major cities","is often attributed to","poor urban planning."],"uz":"Yirik shaharlardagi tirbandlik ko‘pincha yomon shahar rejalashtirishiga bog‘lanadi.","ru":"Пробки в крупных городах часто объясняют плохим городским планированием."}],"ck":[["Uses “is / are attributed to”",/\b(is|are|was|were)\s+(often |widely |commonly )?attributed to\b/i],["A cause follows “attributed to”",/attributed to\s+\w+/i]],"w":[{"p":"Why do some students fail exams?","m":"{a|Poor exam results} {k|are often attributed to} {b|a lack of regular revision}."},{"p":"What causes stress in modern life?","m":"{a|Stress among workers} {k|is often attributed to} {b|long hours and heavy workloads}."},{"p":"Why are obesity rates rising?","m":"{a|Rising obesity} {k|is often attributed to} {b|unhealthy diets and inactive lifestyles}."}]}]);
D.push(...[{"t":"“Subject + is by no means + adjective / noun”","tag":"Speaking + Writing","mw":8,"def":"A strong, emphatic denial: much more forceful than “is not”.","f":"{a|Subject} {k|is by no means} {b|adjective / noun}","lg":["a","k","b"],"lt":{"a":"Subject","k":"Fixed words","b":"What it definitely is not"},"st":{"uz":"…aslo … emas","ru":"ни в коем случае не …, отнюдь не …"},"p":{"ipa":"/ɪz baɪ nəʊ miːnz/","say":"iz by <b>NOH</b> <b>MEENZ</b>","ph":"is by no means"},"eg":["{a|This} {k|is by no means} {b|an easy task}.","{a|He} {k|is by no means} {b|the only person responsible}."],"ie":["{a|Online education} {k|is by no means} {b|a complete replacement for traditional classroom learning}.","{a|University education} {k|is by no means} {b|the only path to professional success}."],"tip":"It already means “not”, so never add another “not” after it.","tr":{"uz":["Kuchli inkor: “is not”dan ancha qat’iyroq; keng tarqalgan fikrga qarshi chiqishga mos.","Bu aslo oson vazifa emas."],"ru":["Сильное отрицание: заметно категоричнее, чем «is not»; удобно, чтобы возразить распространённому мнению.","Это ни в коем случае не простая задача."]},"t1":[{"c":["This task","is by no means","easy."],"uz":"Bu vazifa aslo oson emas.","ru":"Эта задача ни в коем случае не лёгкая."},{"c":["Technology","is by no means","the only factor influencing economic growth."],"uz":"Texnologiya iqtisodiy o‘sishga ta’sir qiluvchi yagona omil emas.","ru":"Технологии — отнюдь не единственный фактор, влияющий на экономический рост."},{"c":["University education","is by no means","the only path to professional success."],"uz":"Universitet ta’limi kasbiy muvaffaqiyatga yagona yo‘l emas.","ru":"Университетское образование — отнюдь не единственный путь к профессиональному успеху."}],"ck":[["Uses “is / are by no means”",/\b(is|are|was|were) by no means\b/i],["Something follows, with no extra “not”",/by no means\s+(?!not\b)\w+/i]],"w":[{"p":"Is online learning as good as classroom learning?","m":"{a|Online learning} {k|is by no means} {b|a perfect replacement for classroom teaching}."},{"p":"Is money the key to happiness?","m":"{a|Money} {k|is by no means} {b|the only source of happiness}."},{"p":"Do you think learning English is easy?","m":"{a|Learning English} {k|is by no means} {b|an easy process}."}]},{"t":"“Subject + results in + noun / V-ing”","tag":"Speaking + Writing","mw":8,"def":"Shows a direct cause and effect. It is more formal and precise than “causes”.","f":"{a|Cause} {k|results in} {b|effect (noun / V-ing)}","lg":["a","k","b"],"lt":{"a":"The cause","k":"Fixed words","b":"The effect"},"st":{"uz":"…ga olib keladi","ru":"приводит к …, влечёт за собой …"},"p":{"ipa":"/rɪˈzʌlts ɪn/","say":"rih-<b>ZULTS</b> in","ph":"results in"},"eg":["{a|Poor sleep} {k|results in} {b|reduced concentration}.","{a|Lack of planning} {k|results in} {b|wasted time}."],"ie":["{a|Excessive use of smartphones} {k|results in} {b|reduced face-to-face communication}.","{a|Lack of investment in education} {k|results in} {b|slower economic development}."],"tip":"The cause comes first, the effect after “in”: A results in B.","tr":{"uz":["To‘g‘ridan-to‘g‘ri sabab-oqibat aloqasini ifodalaydi; “causes”dan rasmiyroq.","Yomon uyqu e’tiborning pasayishiga olib keladi."],"ru":["Выражает прямую причинно-следственную связь; формальнее, чем «causes».","Плохой сон приводит к снижению концентрации."]},"t1":[{"c":["Poor sleep","results in","reduced concentration."],"uz":"Yomon uyqu e’tiborning pasayishiga olib keladi.","ru":"Плохой сон приводит к снижению концентрации."},{"c":["Lack of planning","results in","wasted time."],"uz":"Rejalashtirishning yetishmasligi vaqtning behuda ketishiga olib keladi.","ru":"Отсутствие планирования приводит к потере времени."},{"c":["Rapid urbanisation","sometimes results in","environmental degradation."],"uz":"Tez urbanizatsiya ba’zan atrof-muhitning yomonlashuviga olib keladi.","ru":"Быстрая урбанизация иногда приводит к деградации окружающей среды."}],"ck":[["Uses “results in”",/\bresult(s|ed)? in\b/i],["An effect follows “in”",/result(s|ed)? in\s+\w+/i]],"w":[{"p":"What happens when people sleep too little?","m":"{a|A lack of sleep} {k|results in} {b|poor concentration and low energy}."},{"p":"What are the effects of heavy traffic?","m":"{a|Heavy traffic} {k|results in} {b|air pollution and wasted time}."},{"p":"What happens when students do not revise?","m":"{a|Poor preparation} {k|often results in} {b|disappointing exam results}."}]},{"t":"“It goes without saying that…”","tag":"Speaking + Writing","mw":12,"def":"Start with a fact everyone accepts, then build a deeper or contrasting point on top.","f":"{k|It goes without saying that} {a|obvious fact}. {k|However,} {b|your deeper point}.","lg":["k","a","b"],"lt":{"k":"Fixed words","a":"A fact everyone accepts","b":"Your stronger or contrasting point"},"st":{"uz":"…, albatta, o‘z-o‘zidan ma’lum. Biroq …","ru":"Само собой разумеется, что … Однако …"},"p":{"ipa":"/ɪt ɡəʊz wɪðˈaʊt ˈseɪɪŋ ðæt/","say":"it gohz with-<b>OWT</b> <b>SAY</b>-ing that","ph":"It goes without saying that"},"eg":["{k|It goes without saying that} {a|sleep is important}. {k|However,} {b|many people sacrifice it for work}.","{k|It goes without saying that} {a|exercise is beneficial}. {k|Nevertheless,} {b|motivation remains the biggest barrier}."],"ie":["{k|It goes without saying that} {a|access to clean water is a basic human right}. {k|However,} {b|millions of people in developing nations are still denied this necessity}.","{k|It goes without saying that} {a|education shapes a nation’s future}. {k|Nevertheless,} {b|underfunded schools continue to widen the gap between social classes}."],"tip":"State the obvious first, then turn with However or Nevertheless.","tr":{"uz":["Hamma qabul qilgan faktdan boshlab, so‘ng chuqurroq yoki qarama-qarshi fikr bildirasiz.","Uyqu muhimligi o‘z-o‘zidan ma’lum. Biroq ko‘pchilik uni ish uchun qurbon qiladi."],"ru":["Начинаете с общепризнанного факта, затем добавляете более глубокую или противоположную мысль.","Само собой разумеется, что сон важен. Однако многие жертвуют им ради работы."]},"t1":[{"c":["It goes without saying that","sleep is important.","However,","many people sacrifice it for work."],"uz":"Uyqu muhimligi o‘z-o‘zidan ma’lum. Biroq ko‘pchilik uni ish uchun qurbon qiladi.","ru":"Само собой разумеется, что сон важен. Однако многие жертвуют им ради работы."},{"c":["It goes without saying that","exercise is beneficial.","Nevertheless,","motivation remains the biggest barrier."],"uz":"Mashq foydali ekani o‘z-o‘zidan ma’lum. Shunday bo‘lsa-da, eng katta to‘siq motivatsiya bo‘lib qolmoqda.","ru":"Само собой разумеется, что упражнения полезны. Тем не менее главным барьером остаётся мотивация."},{"c":["It goes without saying that","education shapes a nation’s future.","Nevertheless,","underfunded schools widen the gap between social classes."],"uz":"Ta’lim millat kelajagini belgilashi o‘z-o‘zidan ma’lum. Shunday bo‘lsa-da, kam moliyalashtirilgan maktablar ijtimoiy tabaqalar o‘rtasidagi farqni kengaytirmoqda.","ru":"Само собой разумеется, что образование определяет будущее нации. Тем не менее недофинансируемые школы увеличивают разрыв между социальными классами."}],"ck":[["Starts with “It goes without saying that”",/^\s*it goes without saying that/i],["Then turns with However / Nevertheless",/\b(however|nevertheless)\b/i]],"w":[{"p":"Health: state something obvious, then add a problem.","m":"{k|It goes without saying that} {a|healthy food is important}. {k|However,} {b|many people choose fast food because it is cheap}."},{"p":"Education: state an obvious truth, then a challenge.","m":"{k|It goes without saying that} {a|teachers shape young minds}. {k|Nevertheless,} {b|they are often underpaid and overworked}."},{"p":"Technology: state an obvious benefit, then a risk.","m":"{k|It goes without saying that} {a|smartphones make life easier}. {k|However,} {b|they can also reduce face-to-face communication}."}]},{"t":"“What is more…”","tag":"Speaking + Writing","def":"A sophisticated way to say “also”: the next point is even stronger than the last.","f":"{a|First point}. {k|What is more,} {b|stronger point}.","lg":["a","k","b"],"lt":{"a":"Your first point","k":"Fixed words","b":"An even stronger point"},"st":{"uz":"Bundan tashqari, …","ru":"Более того, …"},"p":{"ipa":"/wɒt ɪz ˈmɔː/","say":"wot iz <b>MAW</b>","ph":"What is more"},"eg":["{a|The restaurant was expensive}. {k|What is more,} {b|the food was not even good}.","{a|She finished the project on time}. {k|What is more,} {b|it exceeded the client’s expectations}."],"ie":["{a|Remote work reduces commuting costs for employees}. {k|What is more,} {b|it significantly lowers carbon emissions}.","{a|Fast food is high in calories}. {k|What is more,} {b|its regular consumption has been directly linked to a rise in childhood obesity worldwide}."],"tip":"Put a comma after “What is more” and make the second point stronger, not just different.","tr":{"uz":["“Also”ning nafis muqobili: keyingi fikr avvalgisidan ham kuchliroq.","Restoran qimmat edi. Bundan tashqari, ovqat ham yaxshi emasdi."],"ru":["Изящная замена «also»: следующий довод ещё сильнее предыдущего.","Ресторан был дорогим. Более того, еда была даже невкусной."]},"t1":[{"c":["The restaurant was expensive.","What is more,","the food was not even good."],"uz":"Restoran qimmat edi. Bundan tashqari, ovqat ham yaxshi emasdi.","ru":"Ресторан был дорогим. Более того, еда была даже невкусной."},{"c":["She finished the project on time.","What is more,","it exceeded the client’s expectations."],"uz":"U loyihani o‘z vaqtida tugatdi. Bundan tashqari, natija mijozning kutganidan ham oshib ketdi.","ru":"Она закончила проект вовремя. Более того, он превзошёл ожидания клиента."},{"c":["Remote work reduces commuting costs.","What is more,","it significantly lowers carbon emissions."],"uz":"Masofaviy ish qatnov xarajatlarini kamaytiradi. Bundan tashqari, u uglerod chiqindilarini sezilarli kamaytiradi.","ru":"Удалённая работа снижает расходы на дорогу. Более того, она заметно сокращает выбросы углерода."}],"ck":[["Uses “What is more,”",/what is more,/i],["Has a first point before it",/\w+\s+\w+.*\.\s*what is more/i]],"w":[{"p":"Praise a city or a place you like.","m":"{a|The city has beautiful parks}. {k|What is more,} {b|it has an excellent public transport system}."},{"p":"Why is learning English useful?","m":"{a|English helps you find better jobs}. {k|What is more,} {b|it lets you communicate with people all over the world}."},{"p":"Why is cycling a good choice?","m":"{a|Cycling keeps you fit}. {k|What is more,} {b|it saves money and protects the environment}."}]}]);
D.push(...[{"t":"“More often than not…”","tag":"Speaking","mw":8,"def":"A natural way to say “usually”. It avoids “always”, which sounds extreme to examiners.","f":"{k|More often than not,} {a|subject} {b|verb phrase (a tendency)}","lg":["k","a","b"],"lt":{"k":"Fixed words","a":"Subject","b":"What usually happens"},"st":{"uz":"Ko‘pincha, aksariyat hollarda, …","ru":"Как правило, чаще всего …"},"p":{"ipa":"/mɔːr ˈɒfn ðən ˈnɒt/","say":"<b>MAW</b>r <b>OF</b>-n than <b>NOT</b>","ph":"More often than not"},"eg":["{k|More often than not,} {a|people} {b|regret decisions they made in a rush}.","{k|More often than not,} {a|the cheapest option} {b|turns out to be the most expensive in the long run}."],"ie":["{k|More often than not,} {a|students who struggle academically} {b|are dealing with issues outside the classroom}.","{k|More often than not,} {a|small businesses} {b|fail because of poor financial planning}."],"tip":"Use it for a tendency, not a fact. It softens “always”.","tr":{"uz":["“Usually”ning tabiiy muqobili; “always”dan qochishga yordam beradi.","Ko‘pincha odamlar shoshilib qabul qilgan qarorlaridan pushaymon bo‘ladi."],"ru":["Естественная замена «usually»; помогает избегать слишком категоричного «always».","Как правило, люди жалеют о решениях, принятых в спешке."]},"t1":[{"c":["More often than not,","people","regret decisions they made in a rush."],"uz":"Ko‘pincha odamlar shoshilib qabul qilgan qarorlaridan pushaymon bo‘ladi.","ru":"Как правило, люди жалеют о решениях, принятых в спешке."},{"c":["More often than not,","the cheapest option","turns out to be the most expensive."],"uz":"Ko‘pincha eng arzon variant oxir-oqibat eng qimmat bo‘lib chiqadi.","ru":"Как правило, самый дешёвый вариант в итоге оказывается самым дорогим."},{"c":["More often than not,","small businesses","fail because of poor financial planning."],"uz":"Ko‘pincha kichik bizneslar yomon moliyaviy rejalashtirish tufayli barbod bo‘ladi.","ru":"Как правило, малый бизнес терпит неудачу из-за плохого финансового планирования."}],"ck":[["Starts with “More often than not,”",/^\s*more often than not,/i],["Describes a tendency after the comma",/not,\s*\S+(\s+\S+){2,}/i]],"w":[{"p":"What do people usually do when they feel stressed?","m":"{k|More often than not,} {a|people} {b|turn to food or social media when they feel stressed}."},{"p":"Why do students choose their universities?","m":"{k|More often than not,} {a|students} {b|choose a university because of its reputation}."},{"p":"What happens when people rush a decision?","m":"{k|More often than not,} {a|rushed decisions} {b|lead to regret}."}]},{"t":"“Not only… but also…”","tag":"Speaking + Writing","def":"Packs two strong points into one sentence. At the start, the verb comes before the subject.","f":"{k|Not only does} {a|first point}, {k|but it also} {b|second point}","lg":["k","a","b"],"lt":{"k":"Fixed words","a":"First advantage","b":"Second advantage"},"st":{"uz":"nafaqat …, balki … ham","ru":"не только …, но и …"},"p":{"ipa":"/nɒt ˈəʊnli dʌz … bʌt ɪt ˈɔːlsəʊ/","say":"not <b>OHN</b>-lee duz … but it <b>AWL</b>-soh","ph":"Not only does … but it also"},"eg":["{k|Not only does} {a|exercise improve physical health}, {k|but it also} {b|boosts mental wellbeing}.","{a|Reading} {k|not only} {a|improves vocabulary}, {k|but also} {b|sharpens critical thinking}."],"ie":["{k|Not only does} {a|globalisation create economic opportunities}, {k|but it also} {b|exposes local cultures to the risk of homogenisation}.","{a|Renewable energy} {k|not only} {a|reduces dependence on fossil fuels}, {k|but also} {b|creates millions of employment opportunities}."],"tip":"After an opening “Not only”, invert: Not only does exercise help… (not “Not only exercise helps”).","tr":{"uz":["Ikki kuchli fikrni bitta gapga jamlaydi; gap boshida kelsa, kesim egadan oldin keladi.","Mashq nafaqat jismoniy salomatlikni yaxshilaydi, balki ruhiy farovonlikni ham oshiradi."],"ru":["Соединяет два сильных довода в одном предложении; в начале предложения порядок слов меняется (инверсия).","Физические упражнения не только улучшают физическое здоровье, но и повышают психическое благополучие."]},"t1":[{"c":["Not only does","exercise improve physical health,","but it also","boosts mental wellbeing."],"uz":"Mashq nafaqat jismoniy salomatlikni yaxshilaydi, balki ruhiy farovonlikni ham oshiradi.","ru":"Физические упражнения не только улучшают физическое здоровье, но и повышают психическое благополучие."},{"c":["Not only does","globalisation create economic opportunities,","but it also","exposes local cultures to homogenisation."],"uz":"Globallashuv nafaqat iqtisodiy imkoniyatlar yaratadi, balki mahalliy madaniyatlarni bir xillashuv xavfiga ham duchor qiladi.","ru":"Глобализация не только создаёт экономические возможности, но и подвергает местные культуры риску унификации."},{"c":["Reading","not only improves vocabulary,","but also","sharpens critical thinking."],"uz":"Kitob o‘qish nafaqat lug‘at boyligini oshiradi, balki tanqidiy fikrlashni ham charxlaydi.","ru":"Чтение не только расширяет словарный запас, но и развивает критическое мышление."}],"ck":[["Uses “not only … but also”",/not only.*but\s+(it\s+|they\s+)?also/i],["Correct order after an opening “Not only”",/^(?!\s*not only)|^\s*not only\s+(does|do|did|is|are|can|will|has|have|would)\b/i]],"w":[{"p":"Why is sport good for you?","m":"{k|Not only does} {a|sport keep us fit}, {k|but it also} {b|helps us make new friends}."},{"p":"What are the benefits of learning a language?","m":"{a|Learning a language} {k|not only} {a|opens up career opportunities}, {k|but also} {b|improves memory}."},{"p":"Why should cities build more parks?","m":"{k|Not only do} {a|parks improve air quality}, {k|but they also} {b|give people a place to relax}."}]},{"t":"“It is high time (that)…”","tag":"Speaking + Writing","mw":8,"def":"Something urgent should already have happened. The verb after it is past simple, even though the meaning is now.","f":"{k|It is high time (that)} {a|subject} {b|pa
