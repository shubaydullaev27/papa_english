<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#2f1320;--wine2:#4a1f2b;--cream:#f7eddc;--ink:#3a1a1f;--mute:#7a5a58;--gold:#c9a24f;--gold2:#9a6f1e;--rose:#d4808a;--line:#e3d3b8;--ok:#1d6b3f;--okbg:#d9eddc;--bad:#a3262a;--badbg:#f6d9d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--wine)}
body{margin:0;background:var(--wine);color:var(--ink);font:20px/1.65 "Cormorant Garamond",Georgia,serif;font-weight:500}
.k{font:600 13px/1 "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--gold)}
h1{font:italic 700 clamp(1.7rem,5.5vw,2.8rem)/1.15 "Playfair Display",serif;margin:.3em 0 0;color:var(--cream)}
.hero{position:relative;max-width:980px;margin:0 auto}
.hero img{display:block;width:100%;height:auto;border-bottom:4px solid var(--gold)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(47,19,32,.92));text-align:center}
.back{position:absolute;top:12px;left:12px;padding:7px 14px;border-radius:20px;border:1px solid var(--gold);background:rgba(47,19,32,.75);color:var(--cream);font:700 16px "Cormorant Garamond",serif;cursor:pointer;backdrop-filter:blur(4px)}
.w{max-width:760px;margin:0 auto;padding:0 14px 70px}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 12px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--wine2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .6s}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{flex:1 0 auto;padding:10px 14px;border:1px solid var(--wine2);background:var(--wine2);color:#e9d9c2;border-radius:24px;font:600 16px "Cormorant Garamond",serif;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--gold);color:var(--wine);border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,.fc:focus-visible,.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sec{display:none}.sec.on{display:block;animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--cream);border-radius:4px;padding:26px 22px;border-top:6px solid;border-image:linear-gradient(90deg,var(--rose),var(--gold)) 1;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h2{font:italic 600 1.6rem/1.2 "Playfair Display",serif;margin:.1em 0 .4em;color:var(--wine)}
.sub{color:var(--mute);font-size:17px;margin:0 0 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-weight:600}
.btn,.tools button{padding:8px 16px;border-radius:22px;border:1.5px solid var(--wine);background:transparent;color:var(--wine);font:700 16px "Cormorant Garamond",serif;cursor:pointer}
.btn.p{background:var(--wine);color:var(--cream)}
.sw{width:32px;height:32px;padding:0!important;border-radius:50%!important;border:2px solid var(--wine)!important}.sw.act{box-shadow:0 0 0 3px var(--gold);transform:scale(1.2)}.tools button.act{background:var(--wine);color:var(--cream)}
.pass{font-size:1.28rem;line-height:1.95}.pass p{margin:0}
.pass p+p{margin-top:.9em}.pass p:first-child::first-letter{font:italic 700 3.2rem/.8 "Playfair Display",serif;color:var(--gold2);float:left;padding:6px 8px 0 0}
.pass.er mark{cursor:pointer;outline:1px dashed var(--bad)}
mark{border-radius:3px;padding:0 1px;color:#000}
.kw{border-bottom:2px dotted var(--gold2);cursor:pointer}
.tip{margin-top:14px;background:var(--wine);color:var(--cream);border-radius:4px;padding:12px 16px;font-size:18px}
.row{padding:10px 0;border-bottom:1px solid var(--line)}.row .q{display:block;margin-bottom:6px}.row .q b{color:var(--gold2)}
input[type=text],select{font:600 18px "Cormorant Garamond",serif;padding:8px 12px;border:1.5px solid var(--gold);border-radius:6px;background:#fffaf0;color:var(--ink);min-width:170px;max-width:100%}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}.no{background:var(--badbg)!important;border-color:var(--bad)!important}
.opt{display:block;padding:9px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;background:#fffaf0}.opt input{margin-right:8px;accent-color:var(--wine)}
.score{font:700 20px "Cormorant Garamond",serif;margin-top:14px;color:var(--wine)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.bank span.bw,.bank>span{background:var(--wine);color:var(--cream);padding:2px 12px;border-radius:14px;font-size:16px}
.nx{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.3rem;padding:26px;cursor:pointer;border:2px solid var(--gold);border-radius:6px;background:#fffaf0;color:var(--wine)}
.fc b{font:italic 700 2.3rem "Playfair Display",serif;color:var(--gold2)}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* home */
#home{max-width:980px;margin:0 auto;padding:44px 16px 70px;text-align:center}
#home h1{font-size:clamp(2.2rem,7vw,3.6rem)}
#home p.lead{color:#e9d9c2;max-width:520px;margin:12px auto 30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:22px;text-align:left}
.pick{display:flex;flex-direction:column;justify-content:flex-start;padding:0;border:0;background:var(--cream);color:var(--ink);border-radius:4px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.pick:hover{transform:translateY(-6px)}
.pick img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;border-bottom:4px solid var(--gold)}
.pick div{padding:16px 20px 20px;flex:1}.pick img{flex:none}.pick h3{font:italic 700 1.5rem/1.2 "Playfair Display",serif;color:var(--wine);margin:.3em 0 .2em}
.pick .k{color:var(--gold2)}.chip{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:14px;background:var(--wine);color:var(--cream);font-size:16px}
.bb{left:auto;right:12px}
.wl{margin-bottom:6px}.wrow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.wrow b{color:var(--wine)}.wrow span{color:var(--mute);font-size:17px}.wrow .btn{white-space:nowrap}
.gold{background:var(--gold);color:var(--wine);border-color:var(--gold);font-size:19px;padding:12px 26px}
#bankv{max-width:760px;margin:0 auto;padding:30px 14px 70px;text-align:center}
#bankv .back{position:static;display:inline-block;margin-bottom:14px}
.bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 6px}
#bankv .btn{border-color:var(--gold);color:var(--cream)}#bankv .btn.on{background:var(--gold);color:var(--wine)}
#bcount{color:#e9d9c2;font-size:17px;margin:4px 0 14px}
#blist{display:grid;gap:14px;text-align:left}
.we{background:var(--cream);border-radius:4px;padding:16px 18px;border-top:5px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.we h3{font:italic 700 1.5rem "Playfair Display",serif;color:var(--wine);margin:0}.we .k{color:var(--gold2)}
.det p{margin:.25em 0;font-size:18px}.df{font-weight:700}.ex{font-style:italic;color:var(--mute)}
.lg{display:inline-block;background:var(--wine);color:var(--cream);font:700 12px/1 system-ui,sans-serif;padding:3px 6px;border-radius:3px;margin-right:6px;letter-spacing:.08em}
#bankv .we .rm{margin-top:8px;padding:3px 12px;font-size:15px;color:var(--bad);border-color:var(--bad)}
.test .we:not(.open) .det{filter:blur(8px);user-select:none}.test .we{cursor:pointer}
.empty{background:var(--cream);padding:26px;border-radius:4px;text-align:center}
.nwf{display:none;margin-top:14px;background:#fffaf0;border:1.5px solid var(--gold);border-radius:6px;padding:14px 16px}.nwf.on{display:block}
.nwf label{display:block;font-weight:700;margin:8px 0 2px;color:var(--wine);font-size:17px}.nwf input{width:100%;min-width:0}
.nwf .lk{font-size:17px;margin:10px 0 0}.nwf .lk a{color:var(--gold2);margin-right:14px;font-weight:700}
#lvl{max-width:980px;margin:0 auto;padding:30px 16px 70px;text-align:center}#lvl h1{font-size:clamp(2.2rem,7vw,3.6rem)}
#lvl p.lead{color:#e9d9c2;max-width:520px;margin:12px auto 30px}#lvl .back{position:static;display:inline-block;margin-bottom:14px}
.pick.off{opacity:.65;cursor:default}.pick.off:hover{transform:none}
.soon{display:flex;align-items:center;justify-content:center;aspect-ratio:2/1;background:radial-gradient(circle at 50% 40%,var(--wine2),var(--wine));border-bottom:4px solid var(--gold);color:var(--gold);font:italic 700 1.7rem "Playfair Display",serif}
/* curtain */
#cur{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,var(--wine2),var(--wine) 70%);transform:translateY(-101%);pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .6s cubic-bezier(.7,0,.2,1)}
#cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--rose),var(--gold))}
#cur.in{transform:none;pointer-events:all}#cur.out{transform:translateY(101%)}#cur.rs{transition:none}
#cur div{opacity:0;transition:opacity .4s .25s;padding:20px}#cur.in div{opacity:1}
@media (prefers-reduced-motion:reduce){#cur,.sec.on,.pick,.bar i{transition:none;animation:none}}

/* tap-a-word popup */
#pop{position:fixed;left:0;top:0;z-index:60;width:min(340px,calc(100vw - 20px));background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:10px;padding:12px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);font:500 18px/1.4 "Cormorant Garamond",Georgia,serif}
#pop::after{content:"";position:absolute;left:var(--ax,50%);width:14px;height:14px;background:var(--cream);border:2px solid var(--gold);transform:translateX(-50%) rotate(45deg)}
#pop.b::after{top:-9px;border-right:0;border-bottom:0}#pop.t::after{bottom:-9px;border-left:0;border-top:0}
#pop .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#pop .pw{font:italic 700 1.55rem/1.2 "Playfair Display",serif;color:var(--wine)}
#pop .px{flex:none;width:34px;height:34px;margin:-4px -8px 0 0;border:0;background:transparent;color:var(--mute);font:400 26px/1 system-ui,sans-serif;cursor:pointer}
#pop p{margin:.2em 0}#pop .pd{font-weight:700}#pop .pe{font-style:italic;color:var(--mute);font-size:17px}
#pop .pa{margin-top:8px;padding:5px 16px;font-size:16px}
.tl{margin-top:6px;font-size:18px;line-height:1.5;text-align:center}.tl .lg{color:var(--cream)}
.wrow .tl{text-align:left;margin-top:2px;color:var(--ink);font-size:17px}.wrow .lg{color:var(--cream);font-size:12px}
.bank .bw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;padding:4px 12px;cursor:pointer;user-select:none}
.bank .bw small{font-size:13px;color:var(--gold);white-space:nowrap}
.bank .bw:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* generative covers */
.hero{min-height:360px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-bottom:4px solid var(--gold);background:radial-gradient(circle at 50% 40%,var(--wine2),var(--wine) 78%)}
.hero .art{position:absolute;inset:0}.hero .art svg{display:block;width:100%;height:100%}
.hero .ctr{position:relative;padding:74px 28px 38px;max-width:660px;background:radial-gradient(ellipse at center,rgba(47,19,32,.92) 35%,rgba(47,19,32,0) 74%)}
.hero .orn{color:var(--gold);font-size:13px;letter-spacing:.2em;margin:14px 0 4px}
.hero .pq{font:italic 500 1.2rem/1.5 "Cormorant Garamond",Georgia,serif;color:#e9d9c2;margin:10px auto 0;max-width:520px}
.hero .hw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.hero .hw span{border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:1px 12px;font:600 15px "Cormorant Garamond",serif;letter-spacing:.04em}
.pick .art{position:relative;display:block;aspect-ratio:2/1;overflow:hidden;border-bottom:4px solid var(--gold);background:radial-gradient(circle at 50% 40%,var(--wine2),var(--wine) 80%)}
.pick .art svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pick:hover .art svg{transform:scale(1.07) rotate(.6deg)}
.pick .art b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 700 clamp(3.4rem,11vw,5.2rem)/1 "Playfair Display",serif;color:var(--cream);text-shadow:0 0 28px var(--wine),0 0 10px var(--wine),0 2px 0 var(--wine)}
@media (prefers-reduced-motion:reduce){.pick .art svg{transition:none}}

/* compact covers (v3) */
.hero{min-height:0}
.hero .ctr{padding:58px 22px 20px;max-width:620px}
.hero h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:.15em 0 0}
.hero .orn{margin:8px 0 2px;font-size:11px}
.hero .pq{font-size:1.02rem;line-height:1.4;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hw{margin-top:10px;gap:6px}.hero .hw span{font-size:14px;padding:0 10px}
.hero .back{top:10px;padding:5px 12px;font-size:15px}.hero .bb{right:10px}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.pick .art{aspect-ratio:3.6/1}
.pick .art b{font-size:clamp(2rem,7vw,2.8rem)}
.pick div{padding:12px 16px 14px}
.pick h3{font-size:1.3rem;margin:.2em 0 .1em}
.pick div>span:not(.k):not(.chip){font-size:17px;line-height:1.35;display:block}
.chip{margin-top:6px;font-size:15px;padding:1px 10px}
#home{padding:30px 14px 56px}#lvl{padding:22px 14px 56px}
#home p.lead,#lvl p.lead{margin:8px auto 20px}
@media (max-width:560px){
body{font-size:18px}
.hero .ctr{padding:50px 14px 16px}
.hero .hw span:nth-child(n+4){display:none}
.hero .pq{font-size:.95rem}
.pick .art{aspect-ratio:4.2/1}
.card{padding:20px 14px}
.pass{font-size:1.15rem;line-height:1.85}
.w{padding:0 10px 56px}
nav button{padding:8px 12px;font-size:15px}
.tools{gap:6px}.tools button{padding:6px 12px;font-size:15px}
.nx .btn,.ctl .btn{flex:1 1 auto}
}
</style></head><body>
<div id="cur"><div><span class="k" id="ck"></span><h1 id="ct"></h1></div></div>

<main id="home">
<span class="k">READ · DISCOVER · PRACTISE</span>
<h1>Reading Room</h1>
<p class="lead">Choose your level, then pick a reading. Each one has exercises and word practice.</p>
<div class="cards" id="cards"></div>
<div style="margin-top:30px"><button class="btn gold" data-bank>Vocabulary bank (<span id="hbn">0</span> saved)</button></div>
</main>
<main id="lvl" hidden><button class="back" data-home>‹ Levels</button><br><span class="k" id="lk"></span><h1 id="ln"></h1><p class="lead" id="lt"></p><div class="cards" id="lcards"></div>
<div style="margin-top:30px"><button class="btn gold" data-bank>Vocabulary bank (<span class="hbn2">0</span> saved)</button></div></main>
<div id="units"></div>
<main id="bankv" hidden><button class="back" data-home>‹ Back</button><br><span class="k">REVISE</span><h1>My Vocabulary Bank</h1>
<div class="bt"><input type="text" id="bq" placeholder="Search your words…" aria-label="Search"><select id="bf" aria-label="Filter by reading"></select><button class="btn" id="btest">Test myself</button></div>
<p id="bcount"></p><div id="blist"></div></main>

<script>
const $=s=>document.querySelector(s);

/* ---------- generative cover art (no images) ---------- */
function _h(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}
function _r(seed){let a=_h(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GO="#c9a24f",RO="#d4808a",CR="#f7eddc";
const MOTIFS=[
/* 0 sunburst */(r)=>{let s="";const cx=200+r()*400,cy=430;for(let i=0;i<34;i++){const a=Math.PI+i/33*Math.PI;s+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*900}" y2="${cy+Math.sin(a)*900}" stroke="${i%3?GO:RO}" stroke-width="1.4" opacity=".32"/>`}for(let k=1;k<8;k++)s+=`<circle cx="${cx}" cy="${cy}" r="${k*48}" fill="none" stroke="${GO}" stroke-width="1.6" opacity=".4"/>`;return s},
/* 1 rings */(r)=>{let s="";for(let i=0;i<11;i++){const x=r()*800,y=r()*400,R=24+r()*120;s+=`<circle cx="${x}" cy="${y}" r="${R}" fill="${i%4==0?RO:"none"}" fill-opacity=".14" stroke="${i%2?GO:RO}" stroke-width="1.6" opacity=".5"/><circle cx="${x}" cy="${y}" r="${R*.6}" fill="none" stroke="${GO}" stroke-width="1" opacity=".3"/>`}return s},
/* 2 waves */(r)=>{let s="";const ph=r()*6;for(let j=0;j<11;j++){let p="";const y0=20+j*38,amp=10+r()*22,len=70+j*7;for(let x=0;x<=800;x+=16)p+=`${x},${(y0+Math.sin(x/len+ph+j*.5)*amp).toFixed(1)} `;s+=`<polyline points="${p}" fill="none" stroke="${j%2?GO:RO}" stroke-width="1.6" opacity=".42"/>`}return s},
/* 3 dot field */(r)=>{let s="";const cx=r()*800,cy=r()*400;for(let gx=0;gx<26;gx++)for(let gy=0;gy<13;gy++){const x=gx*32+16,y=gy*32+16,d=Math.hypot(x-cx,y-cy),rad=Math.max(1.4,15-d/26);s+=`<circle cx="${x}" cy="${y}" r="${rad.toFixed(1)}" fill="${(gx+gy)%5?GO:RO}" opacity=".42"/>`}return s},
/* 4 art-deco fans */(r)=>{let s="";for(let row=0;row<8;row++)for(let col=-1;col<11;col++){const cx=col*80+(row%2)*40,cy=row*54+30;for(const R of[38,28,18])s+=`<path d="M${cx-R},${cy} A${R},${R} 0 0 1 ${cx+R},${cy}" fill="none" stroke="${R==28?RO:GO}" stroke-width="1.4" opacity=".42"/>`}return s},
/* 5 letter rain */(r,t)=>{let s="";const L=t.replace(/[^A-Za-z]/g,"").toUpperCase()||"READ";for(let i=0;i<20;i++){const c=L[Math.floor(r()*L.length)],sz=60+r()*120;s+=`<text x="${(r()*800).toFixed(0)}" y="${(r()*420).toFixed(0)}" font-family="Playfair Display,Georgia,serif" font-style="italic" font-weight="700" font-size="${sz.toFixed(0)}" fill="none" stroke="${i%3?GO:RO}" stroke-width="1.4" opacity=".4" transform="rotate(${(r()*40-20).toFixed(0)} 400 200)">${c}</text>`}return s},
/* 6 diamond lattice */(r)=>{let s="";const off=r()*30;for(let gx=-1;gx<14;gx++)for(let gy=-1;gy<8;gy++){const x=gx*64+(gy%2)*32+off,y=gy*56,z=30-(Math.abs(gx-6.5)+Math.abs(gy-3.5))*2.2;if(z<4)continue;s+=`<polygon points="${x},${y-z} ${x+z},${y} ${x},${y+z} ${x-z},${y}" fill="none" stroke="${(gx+gy)%3?GO:RO}" stroke-width="1.4" opacity=".45"/>`}return s}
];
function artSVG(title,idx){const r=_r(title+"|"+idx);return `<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${MOTIFS[idx%MOTIFS.length](r,title)}</svg>`}
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X"];
function artCard(title,idx,mark){return `<span class="art">${artSVG(title,idx)}<b>${mark}</b></span>`}

passage:"<p>The doctor-patient relationship is of the greatest importance to the effective use of health services. Studies conducted in England and the United States show that many people resort to self-treatment, and that this is due to a barrier between the doctor and themselves, which makes them too diffident to consult the doctor. At the other end of the scale is the person who believes that the doctor is infallible and who expects miraculous treatment. Thus, the need for health education emerges at this point, not with the aim of making every man his own doctor, but rather with the aim of helping people to judge for themselves when they need professional help. For example, a simple cut on a finger will usually respond to first-aid and a simple dressing to protect it and keep it clean, which can easily be done at home. If the injury occurred in circumstances or places in which dangerous infection was likely - e.g. in cultivated land that might contain tetanus spores - then the patient should consult his doctor. In any case, he should be able to recognize the signs of inflammation, in which case he should consult his doctor.</p>",

kicker:"TEXT 8",title:"The International Olympic Committee",h:"Guardians of the Games",tag:"Who runs the Olympic Games, and why independence matters.",
passage:"<p>At the Congress of Paris in 1894, the control and development of the modern Olympic Games was entrusted to the International Olympic Committee - the IOC - with headquarters to be established in Switzerland. Today the committee is responsible for maintaining the regular celebration of the Olympic Games; seeing that the Games are carried out in the spirit that inspired their revival; and promoting the development of amateur sport throughout the world. The original committee in 1894 consisted of 14 members in addition to Pierre Coubertin - the leader of the movement aiming to restart the Olympic Games of ancient Greece - and since then, membership has been self-perpetuating. Convinced that the downfall of the ancient Olympic Games had been caused by outside influences that undermined the spirit of the Games, Coubertin felt that the revived Games would go the same way unless they were in the hands of people whose concern was to keep the spirit of amateur sport alive and who were responsible in no way to any outside influences. Thus, IOC members are regarded as ambassadors from the IOC to their national sports organizations. They are in no sense delegates to the committee and may not accept from the government of their country, or from any organization or individual, any instructions that in any way affect their independence. The IOC is a permanent organization that elects its own members. Each member - the present membership is about 70 - must speak French or English and be a citizen of or reside in a country that has a National Olympic Committee. With very few exceptions, there is only one member from any one country. Members were originally elected for life, but anyone elected after 1965 must retire at the age of 75.</p>",

passage:"<p>Some of America’s finest novelists began to write in the 1920s, or the “Jazz Age”, as this decade is sometimes termed. Older authors such as Theodore Dreiser and Ellen Glasgow were still writing, but new authors wrote with new attitudes and styles. Most of the serious novelists critically analyzed American society and ways of life and tried to depict Americans as they really were. F. Scott Fitzgerald caught the restless spirit of the 1920s in his <i>The Great Gatsby</i>. Ernest Hemingway depicted war and disillusionment in his <i>The Sun Also Rises</i> and <i>A Farewell to Arms</i>. With his direct, unadorned style and forceful dialogue, Hemingway set a pattern for much future American literature. Sinclair Lewis, the first American to win the Nobel Prize for Literature, satirized the American businessman and small town in his <i>Main Street</i> and <i>Babbitt</i>. His style was mediocre, but his work vividly dissected a large section of American life.</p>",

passage:"<p>It was, Italian authorities said later, as if the thieves had a catalog and knew just what they were after. Armed bandits bound and gagged six unarmed guards, entered a storeroom containing artifacts from the Roman town of Herculaneum, and stole about 280 objects - gold rings, bracelets, earrings, and precious stones. All had been discovered during excavations of the seaside town, buried by the same eruption of Mount Vesuvius in A.D. 79 that destroyed its larger and better-known neighbor, Pompeii. Authorities said that the stolen items also included a small bronze statue of Bacchus inlaid with copper and silver, a bronze vase, and a box of coins. The total value of objects taken during the robbery was estimated at 1.6 million dollars. Art historians and others criticized lax security that permitted two gunmen to climb a wall, enter the site, and break through a flimsy partition to get into the room where the artifacts were kept. Some of the critics also complained that the guards were unarmed. Officials said it would be hard for anyone to sell the stolen objects because all had been catalogued and photographed, and most had been exhibited and published.</p>",

passage:"<p>This is an age of speed! Technological advance has brought jet airplanes and streamlined trains whizzing over transportation lines, helicopters carrying the mail, missiles hurtling through space; telegraphs, long-distance phones, radio, television, telstar and flashing communications. These are just a few examples of the Revolution in Speed, which is hastening us along in its breathless velocity.</p><p>As for reading, thousands of newspapers, hundreds of magazines and dozens of books roll from the presses daily, speeded by technological invention. Yet no one has enough time to read as much as he would wish. We hurry all day long - workers hurry to their jobs in the morning and they hurry through the working hours in an attempt to accomplish as much as possible. After work they hurry home to hurry out in the evening to a business dinner, a social function, or one of many fascinating diversions. There is more reading to be done than ever before and less time in which to do it! What is the answer? Not more time in which to read, but the ability to read more in the time we have.</p>",

kicker:"TEXT 14",title:"Reading to the Child",h:"Opening the locked symbols",tag:"Why parents should read to young children, and when to stop.",
passage:"<p>It is advisable for parents to read to their children at preschool and early primary levels. When they read to a child from story books, comic strips of the better type, and children’s magazines, he becomes aware that books, magazines, and newspapers hold something of interest and amusement for him. He also comes to realize that this “something” which he enjoys is tightly locked within black and white symbols, and that these symbols can be unlocked only when one knows how to read. This awareness and interest form a springboard from which he can leap into learning to read in school, and into the voluntary reading of self-selected books. Parents, however, should not continue reading to their child year after year as he passes through the elementary grades. If the child can only get his reading pleasure through his parents’ efforts, he may not have much incentive for doing the reading himself. Parents should decrease their reading to the child as he learns to read and put him on his own as soon as possible.</p>",

passage:"<p>Perhaps more swimmers have been drowned by cramp than by anything else, and only those who have suffered from it can conceive its fatal power. Even good swimmers, when seized with cramp, have been known to sink instantly, overcome with the sudden pain, and nothing can save the victim but the greatest presence of mind.</p><p>The usual spot where the cramp is felt is the calf of the leg; and it sometimes comes with such violence that the muscles are gathered up into knots. There is only one method of proceeding under such circumstances: to turn on one’s back at once, kick the leg out in the air, disregarding the pain, and rub the spot smartly with one hand, while the other is employed in paddling towards shore.</p><p>These directions are easy enough to give, but quite difficult to obey; cramp seems to deprive the sufferer of all reason for the time, and it seems to overpower him with mingled pain and terror. Therefore, the method of saving a person drowning because of cramp demands great practice. The chief difficulty lies in the fact that a person who cannot swim feels, in deep water, much as if he were falling through air, and consequently clutches instinctively at the nearest object. If he succeeds in grasping the person who is trying to save him, both will probably sink together. Every precaution should be taken to prevent such a misfortune and the drowning man should always be seized from behind and pushed forwards.</p>",

passage:"<p>In most societies differences in play between boys and girls are not merely expected, but actively encouraged. In our own culture, only very young boys may be allowed to play with their sisters’ dolls occasionally without ridicule or remonstrance. And even they are rarely given dolls of their own, although teddies and stuffed animals may be allowed. A seven-year-old boy who enjoys tucking teddies up in cots is likely to be ridiculed if he does it too often. Similarly, girls do enjoy playing with toy cars and train sets, but are rarely given these as presents. Older girls particularly are discouraged from playing boisterous games and may be labelled “tom-boys” if they do not conform to the quieter, gentler, less aggressive activities expected of them. Boys who abstain from rough games, or prefer reading or playing the piano are in danger of being labelled “sissy”.</p>",

kicker:"TEXT 21",title:"The Chain of Hope",h:"Every link counts",tag:"How surgeons, airlines and families join hands to heal children.",
passage:"<p>The children who are cared for by the Chain of Hope come from countries which are stricken by poverty or torn by conflict. They are children who have been injured by a mine or an exploding shell, who have been born with deformities, who have caught diseases or who suffer from the after-effects of injuries. A very simple operation can often save them. But there is usually no prospect of such surgery in their own countries, owing to the lack of specialized expertise and technical resources.</p><p>“Faced with this terrible fact,” says Professor Alain Deloche, a heart surgeon, “a simple idea took root: to bring these children to France, to provide them with operations, and send them home, cured, to their families.”</p><p>To achieve this, continues Professor Deloche, “one simply needs to bring into action a series of links in a chain of skills, asking people with all types of expertise to join in. This project has a powerful appeal. Everyone can participate and become a link in the chain.”</p><p>And so, well-known surgeons, the most highly skilled in their fields, operate free of charge in their hospitals throughout France.</p><p>Similarly, ambulances provide the children with free transport, and the airlines Air France and UTA offer complimentary tickets. At the end of the chain, one finds a network of families who take the children in free of charge during their recovery.</p><p style=\"text-align:right;font-style:italic;font-size:.85em;color:var(--mute)\">(From the United Nations’ monthly magazine <i>Refugees</i>)</p>",

kicker:"TEXT 22",title:"Charles Chaplin",h:"From the slums to silent stardom",tag:"How a penniless music-hall artist became the king of silent movies.",
passage:"<p>In 1911 a penniless young music-hall artist left England for America. His future was uncertain, but he did not believe it could be unhappier than his past. He had grown up in the slums of London’s East End and had experienced great poverty. His mother’s life had been so hard that she had finally gone mad, and his father had died of drink. Both parents had been on the stage and lived in the hope that they would one day be stars. Their son was determined to succeed where they had failed. By 1914 his optimism and determination had been justified. Charles Chaplin was the most talked-about man in America, the king of silent movies. He was not only admired as a first-class actor and comedian, he was also making his name as a director. How did he reach the top of the film world in such a short time? He was not an instant success. His attempts to copy other slapstick comedians who were popular at that time were a failure. However he gradually began to develop the character of the tramp that will always be connected with his name. He borrowed ideas from many sources and though he “stole” most of his clothes from other slapstick comedians of the time, he developed his own special mannerisms to go with them. He used his bowler hat to signal secret messages and his walking stick allowed him to cause confusion and punish his enemy from a distance. He got the idea for his famous flat-footed walk from a London taxi driver who had sore feet.</p>",

passage:"<p>Psychologists believe that the combative and aggressive instinct is permanent in all human beings; but it is probable that, with a correct understanding of children, the instinct for aggression need not survive childhood. It’s certain that to repress the aggressiveness of a child will make him later more aggressive and anti-social; he will later on revenge himself for his sufferings by criminality or by acts of cruelty. The desire to hurt living things generally appears in the child who has been given a strong hatred of authority. This problem of cruelty is very difficult to handle. It requires the parents to use good temper and good sense, trying to find out where the child’s real interests lie and guiding his energy to these channels. Except in the worst cases, sympathetic treatment by parents and teachers will gradually suffice to cure, for it will give back self-confidence, self-love, and a belief in life, and it is the absence of these which is the cause of cruelty.</p>",

kicker:"TEXT 24",title:"Headset Stereos",h:"The hidden cost of loud music",tag:"How headset stereos can quietly damage young ears.",
passage:"<p>Most headset stereos have one thing in common: they can cause hearing loss. Studies have shown that sound levels from the machines can reach 115 decibels or more - roughly equivalent to standing 100 feet from a commercial jet at the moment of take-off. At that level, permanent hearing damage can occur after just 15 minutes. And the earlier a child begins using a headset, the more damage can accumulate. Loud noise causes hearing loss by killing irreplaceable hair cells in the inner ear. Normally, the process occurs slowly as people age, but noise damage can accelerate it. Noise-induced hearing loss is insidious; damage may not be apparent until later in life. Since headsets are used privately, parents often don’t realize how loud their children’s music is.</p>",

kicker:"TEXT 25",title:"The Reasons for Rapid Population Growth",h:"Why poor families stay large",tag:"Why birth rates fall only when living standards begin to rise.",
passage:"<p>Statistics show that rapid population growth creates problems for developing countries. So why don’t people have fewer children? Statistics from the developed countries suggest that it is only when people’s living standards begin to rise that birth rates begin to fall. There are good reasons for this. Poor countries cannot afford social services and old age pensions, and people’s incomes are so low they have nothing to spare for savings. As a result, people look to their children to provide them with security in their old age. Having a large family can be a form of insurance. And even while they are still quite young, children can do a lot of useful jobs on a small farm. So poor people in a developing country will need to see clear signs of much better conditions ahead before they can think of having smaller families. But their conditions cannot be improved unless there is a reduction in the rate at which population is increasing. This will depend on a very much wider acceptance of family planning and this, in turn, will mean basic changes in attitudes.</p>",

},{"kicker": "TEXT 26", "title": "Life After Death", "h": "A journey, not an ending", "tag": "How the Balinese turn a funeral into a celebration.", "passage": "<p>Nearly all religions include the belief that human beings survive death in some form. For many people, such as the Balinese, a funeral symbolizes the passage from one life to another, rather than the end of a person’s existence. In Bali, a cremation is therefore a time of joy and celebration. On the morning of the cremation, friends and relatives gather to pay their last respects and to eat and drink with the family. There is then a procession to the cremation ground, some men carrying the corpse in a tower built of bamboo and paper, and other men carrying a special container called a sarcophagus, which may be in the shape of a cow or a bull. At the cremation ground the body is transferred to the sarcophagus and when it has been reduced to ashes and the soul released, there is a happy noisy procession to the sea, where the ashes are scattered. This last section of the ceremony represents cleansing and purification.</p>", "V": [["ceremony held when somebody has died", ["funeral"]], ["journey; transition", ["passage"]], ["ceremony during which a dead body is burnt", ["cremation"]], ["great happiness", ["joy"]], ["occasion when people get together to enjoy themselves because something special has happened", ["celebration"]], ["come together in a group", ["gather", "gathered"]], ["show one’s good opinion of someone who has died, e.g., by attending a funeral (phrase)", ["pay one’s last respects", "pay their last respects", "pay your last respects", "pay his last respects", "pay her last respects"]], ["line of people who are going somewhere together for a special reason", ["procession"]], ["dead body", ["corpse"]], ["something which you can put things in, e.g., a box", ["container"]], ["move to a different place", ["transfer", "transferred"]], ["the part of a person which is not physical and therefore it’s commo ught fame and glory to others. His famous will, in which he left money to provide prizes for outstanding work in Physics, Chemistry, Physiology, Medicine, Literature and Peace, is a memorial to his interests and ideals. And so, the man who felt he should have died at birth is remembered and respected long after his death.</p>", "V": [["noticeable differences when compared", ["contrasts", "contrast"]], ["enormous amount of money", ["fortune"]], ["with other people present", ["in company"]], ["without anybody present", ["in private"]], ["loving and being faithful to one’s own country", ["patriotic"]], ["general name for substance which causes something, e.g. a bomb, to blow up", ["explosive"]], ["digging deep underground to get minerals such as coal and diamonds", ["mining"]], ["attention from the public", ["publicity"]], ["condition of being well-known", ["fame"]], ["have a liking or preference for (phrase)", ["have a taste for", "taste for"]], ["admiration and honour for an achievement", ["glory"]], ["document written before death which says what should happen to one’s possessions after death", ["will"]], ["impressive; remarkable", ["outstanding"]], ["something by which it becomes possible to remember a past event or person", ["memorial"]]], "Q": [["From the descriptions in the passage, we can conclude that Alfred Nobel…", ["led a steady and luxurious life", "never felt happy in his life", "believed that life wasn’t worth living", "lived in affluence throughout his life", "had a life full of contradictions"], 4], ["Since Alfred Nobel’s death,…", ["there have been many outstanding people in the fields which he had supported during his life", "work towards world peace has been sped up", "his inventions in different fields have been awarded with several prizes", "the people who do the best work in certain fields have been honoured through his will", "the contrasts in his life haven’t been explained satisfactorily"], 3], ["Alfred Nobel considered himself useless…", ["be e bills come in and they are unable to pay. Economizers are practical people who spend wisely, usually making use of a budget. They can enjoy more and various material things and activities due to their careful utilization of funds. They spend in moderation and save in moderation for their future retirement or the education of their children. Of these three types of people, economizers are what most of us are having to be in our age. The acute problems of inflation, shortages, and low salaries are forcing us to become economizers. It is the only way to survive in the future. Hopefully, the misers and big spenders will modify their extreme attitudes towards money in these circumstances and convert into economizers.</p>", "V": [["be unable to, or find it difficult to, think of anything else", ["be obsessed", "obsessed", "is obsessed", "are obsessed"]], ["collect over a period of time", ["accumulate"]], ["the part of a bed which is slept on", ["mattress", "mattresses"]], ["stop oneself from having or enjoying something (phrase)", ["deprive oneself of", "deprive themselves of", "deprive yourself of", "deprive themselves"]], ["luxurious; fancy", ["elaborate"]], ["use (phrase)", ["make use of", "making use of"]], ["use in a practical way [noun]", ["utilization", "utilisation"]], ["sharp; severe", ["acute"]], ["change slightly", ["modify", "modified"]]], "Q": [["According to the writer, some spenders use their credit cards…", ["to buy elaborate gifts for their friends", "mostly for their essentials", "for bills which they are unable to pay in cash", "so that they can be generous", "with results for which they are eventually sorry"], 4], ["The writer implies that the economizers…", ["spend more on the necessary things and less on entertainment", "have the best attitude to money", "give their children a better education", "are only interested in material things", "are much better than other people"], 1], ["The writer states that…", ["we are being forced to become economizers , "clear-cut", "engaging", "effervescent", "rear", "unprecedented", "mayhem"]},{"kicker": "TEXT 33", "title": "Chinese New Year", "h": "Dragons, red envelopes and fresh starts", "tag": "Traditions and superstitions of China’s biggest holiday.", "passage": "<p>The most important holiday in China is the Lunar New Year. Since it is based on the lunar calendar, it comes about a month later than the Western New Year. The Chinese New Year season traditionally lasts about a month; however, so that working life will not be interrupted for too long, the period has now been reduced to a week or less. There are some parallels with the Western New Year: houses are cleaned thoroughly, for instance, and families all get together for the festivities. All debts must be paid off so that the new year can start with a fresh beginning. Feasts are enjoyed with family and friends, and there are lively dragon and lion dances in the streets. Everywhere there is the sound of firecracker explosions. Children receive gifts of little red envelopes with money inside them. Many superstitions are related to the celebration of the Chinese New Year. No sweeping should be done in case the family’s good fortune is swept out of the door with the trash. One should be especially careful not to break any dishes, for such an accident is believed to bring about serious problems between members of the family throughout the coming year.</p>", "V": [["concerning the moon", ["lunar"]], ["system of dividing time into years, months, and days", ["calendar"]], ["large, special meal", ["feast", "feasts"]], ["large imaginary animal in legends (usually a winged reptile)", ["dragon", "dragons"]], ["small explosive device which makes a noise and is used for entertainment purposes", ["firecracker", "firecrackers"]], ["belief in cause and effects with no scientific links", ["superstition", "superstitions"]], ["cleaning the floor with a brush or broom", ["sweeping", "sweep"]], ["rubbish", ["trash"]]], "Q": [["The aim in s s with a cube of lead on one scale balancing a big mound of feathers on the other. A second person got no mental image, but simply conceived of the problem in terms of words. People differ greatly in their power to “make pictures in their heads.” Years ago the British scientist Sir Francis Galton asked a group of colleagues to try to visualize the breakfast table as they had sat down to eat that morning. Some of them saw the table in sharp detail and in colour. Others saw it only in black and white. Still others saw a blurred outline, as if through a badly adjusted magic lantern. Many could get no visual image at all. Scientists believe that most people are born with the ability to summon up in the mind’s eye precise visual images of past experiences, but that many of us lose this power as we grow up, simply because we fail to exercise it.</p>", "V": [["one of the light things which cover a bird’s skin and gives the bird its colour", ["feather", "feathers"]], ["soft, heavy metal", ["lead"]], ["go or come quickly (in or out)", ["pop", "popped"]], ["instrument for weighing with two pans that have to be balanced (phrase)", ["a pair of scales", "pair of scales"]], ["solid which has six equally-sized square sides", ["cube"]], ["pile; heap", ["mound"]], ["imagine; form an idea in the mind", ["conceive", "conceived"]], ["clear; distinct", ["sharp"]], ["unclear; indistinct; confused in appearance", ["blurred"]], ["old-fashioned device for projecting pictures onto a screen", ["magic lantern"]], ["gather together; bring into existence (phrase)", ["summon up"]], ["in imagination; in memory (phrase)", ["in the mind’s eye"]]], "Q": [["We can infer that Sir Francis Galton’s aim was…", ["to measure people’s ability to picture past experiences", "to discover what his colleagues had eaten for breakfast", "to find out how much attention his colleagues paid to their domestic surroundings", "to assess the incidence of colour-blindness", "to provide practice in making pictures in one’s /* page transitions */
let busy=false;
function swap(to){closePop();if(to===-2)last=cur;cur=to;$("#home").hidden=to!==-1;$("#bankv").hidden=to!==-2;$("#lvl").hidden=typeof to!=="string";if(to===-1)renderHome();if(to===-2)renderBank();if(typeof to==="string")renderLvl(+to.slice(1));document.querySelectorAll(".unit").forEach((e,i)=>e.hidden=i!==to);window.scrollTo(0,0)}
function show(to){
if(busy)return;if(reduce){swap(to);return}
busy=true;const c=$("#cur");
const S_=typeof to==="string";$("#ck").textContent=to===-1?"READ · DISCOVER · PRACTISE":to===-2?"REVISE":S_?LV[+to.slice(1)].kk:U[to].kicker;$("#ct").textContent=to===-1?"Reading Room":to===-2?"My Vocabulary Bank":S_?LV[+to.slice(1)].name:U[to].title;
c.classList.add("in");
setTimeout(()=>{swap(to);c.classList.add("out");c.classList.remove("in")},1100);
setTimeout(()=>{c.classList.add("rs");c.classList.remove("out");void c.offsetWidth;c.classList.remove("rs");busy=false},1850);
}
